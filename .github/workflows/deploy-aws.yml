name: Deploy to AWS CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::715107195357:role/sizzle-supply-hub-github-deploy
  AWS_S3_BUCKET: sizzle-supply-hub-production-sitebucket-x3sz1kxgzrlc
  AWS_CLOUDFRONT_DISTRIBUTION_ID: E2XBS92MX4B9B5

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static application
        run: npm run build
        env:
          STATIC_ONLY: "1"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload versioned assets
        run: >-
          aws s3 sync dist/client/assets/ "s3://${AWS_S3_BUCKET}/assets/"
          --delete
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload public files
        run: >-
          aws s3 sync dist/client/ "s3://${AWS_S3_BUCKET}/"
          --exclude "assets/*"
          --exclude "_shell.html"
          --cache-control "public,max-age=3600"

      - name: Upload application shell
        run: >-
          aws s3 cp dist/client/_shell.html "s3://${AWS_S3_BUCKET}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"
